[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-satellite"
version = "0.1.0"
description = "Analytical Satellite — time-series collector + delta engine across ELANA dashboards"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Tsvetoslav Tsachev" }]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "yfinance>=0.2.40",
    "pyyaml",
    "pydantic>=2",
    "pydantic-settings",
    "python-dateutil",
    "tzdata",
    "httpx>=0.27",
    "plotly>=5.20",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
]

[project.scripts]
macro-satellite = "macro_satellite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require network access (GitHub API, yfinance)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
