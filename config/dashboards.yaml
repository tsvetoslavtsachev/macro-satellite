# Sources за сателита. github източниците са public repos на github.com/tsvetoslavtsachev/;
# source_kind: yfinance се пълни от собствената backfill-yf стъпка (не през github).
# stale_tolerable_days — collector логва WARNING (не ERROR) ако last commit е по-стар.

dashboards:
  # ETF цените се пълнят от собствената yfinance стъпка (backfill-yf), НЕ от
  # ETF-Dashboard repo (S17 Build A — cross-repo куплунгът премахнат). Записът
  # остава тук, защото S14 data_health го обхожда → etf_prices свежестта се
  # мониторира еднакво (мери се от таблицата). run_collect прескача yfinance вида.
  - name: etf_prices
    table: etf_prices
    source_kind: yfinance
    key_cols: [symbol]
    stale_tolerable_days: 3

  - name: sp500_rotation
    table: rotation_us
    github:
      owner: tsvetoslavtsachev
      repo: SP500-rotationradar
      branch: main
      file: docs/data.json
    parser: macro_satellite.collectors.sp500_rotation:parse
    key_cols: [ticker]
    stale_tolerable_days: 3

  - name: stoxx600_rotation
    table: rotation_eu
    github:
      owner: tsvetoslavtsachev
      repo: STOXX600-rotationradar
      branch: main
      file: docs/data.json
    parser: macro_satellite.collectors.stoxx600_rotation:parse
    key_cols: [ticker]
    stale_tolerable_days: 14

  - name: cot_monitor
    table: cot_positioning
    github:
      owner: tsvetoslavtsachev
      repo: cot-monitor
      branch: main
      file: data/derived/watchlist.json
    parser: macro_satellite.collectors.cot_monitor:parse
    key_cols: [market]
    # COT данните инхерентно изостават: CFTC публикува петък за данните към предния
    # вторник, а cot-monitor обработва седмично -> "as of" датата е нормално ~10д стара
    # и достига ~15-16д точно преди следващия седмичен цикъл. 10д фалшиво палеше червено
    # върху АКТУАЛНИ данни. 17 = седмична каданс (7) + инхерентния COT report-lag (~10);
    # покрива нормалния цикъл + буфер, но пак хваща реален многоседмичен застой. Счупен
    # източник се вижда през fetch/parse грешката, не през staleness.
    stale_tolerable_days: 17

  # Живият VRM мозък (data-core weekly overlay) — публичната VRM health-лампа
  # И единственият VRM feed (мандат №36: ръчните vrm_state/vrm_week канали са
  # пенсионирани изцяло 07.2026; историческият им parquet остава в storage).
  # source_kind: datacore-state → run_collect чете DATACORE_STATE_DIR/vrm_overlay.json[-1]
  # (READ-ONLY към data-core) и пише `vrm` таблицата ПРЕДИ dashboard стъпката, която
  # строи data_health. S14 мери свежестта от max(date) — точно както github сензорите.
  # Липсва ли overlay (без PAT/checkout) → 0 реда → S14 'missing' (честно).
  # Седмичен W-FRI → толеранс 10д (нормална седмица + буфер; по-дълга тишина = реален
  # застой на мозъка, не на сателита).
  - name: vrm
    table: vrm
    source_kind: datacore-state
    key_cols: []
    stale_tolerable_days: 10

  - name: sp500_momentum
    table: sp500_momentum
    github:
      owner: tsvetoslavtsachev
      repo: SP500-momentumrank
      branch: main
      file: data.json
    parser: macro_satellite.collectors.sp500_momentum:parse
    key_cols: [symbol]
    stale_tolerable_days: 3

  - name: stoxx600_momentum
    table: stoxx600_momentum
    github:
      owner: tsvetoslavtsachev
      repo: stoxx600-momentumrank
      branch: main
      file: data.json
    parser: macro_satellite.collectors.stoxx600_momentum:parse
    key_cols: [symbol]
    stale_tolerable_days: 3

  - name: stock_selection
    table: stock_selection
    github:
      owner: tsvetoslavtsachev
      repo: stock-selection-dashboard
      branch: main
      file: app/data/ranked_stocks.json
    parser: macro_satellite.collectors.stock_selection:parse
    key_cols: [ticker]
    stale_tolerable_days: 7

  - name: us_macro_state
    table: us_macro_state
    github:
      owner: tsvetoslavtsachev
      repo: us-macro-dashboard
      branch: main
      file: output/api/macro_state.json
    parser: macro_satellite.collectors.macro_state:parse_us
    key_cols: []
    stale_tolerable_days: 7

  - name: eu_macro_state
    table: eu_macro_state
    github:
      owner: tsvetoslavtsachev
      repo: eu-macro-dashboard
      branch: main
      file: output/api/macro_state.json
    parser: macro_satellite.collectors.macro_state:parse_eu
    key_cols: []
    stale_tolerable_days: 7

  - name: cn_macro_state
    table: cn_macro_state
    github:
      owner: tsvetoslavtsachev
      repo: china-macro-dashboard
      branch: main
      file: output/api/macro_state.json
    parser: macro_satellite.collectors.macro_state:parse_cn
    key_cols: []
    stale_tolerable_days: 7
