    parser: macro_satellite.collectors.vrm_state:parse
    key_cols: []
    stale_tolerable_days: 14

  - name: vrm_week
    table: vrm_week
    github:
      owner: tsvetoslavtsachev
      repo: vrm-state
      branch: main
