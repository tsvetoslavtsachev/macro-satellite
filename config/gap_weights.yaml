# gap тегла (Phase 6 синтез слой) — REGION-KEYED (Тухла 1 US + Тухла 3 разширение).
# Ниво 1: фиксирани СЕМАНТИЧНИ конвенции, нула runtime интерпретация/флагове.
# Двата крака се нормализират до съизмерими скали (~[-1,+1]), и двата ориентирани
# така че + = risk-friendly. gap = markets_axis - economy_axis.
#
# Структура: regions.<REGION>.{economy, markets, gap}. load_gap_weights(region="US").
# Всеки регион носи собствена lens-таксономия (config.MACRO_LENSES) + ETF pairs.
# Всеки orient тук е ОБСЪДЕНО решение (Цветослав), не тих избор.

regions:
  US:
    economy:
      midpoint: 50          # неутрален lens score (breadth 50%)
      scale: 50             # (score - midpoint) / scale → [-1,+1]
      lenses:
        growth:    {weight: 1.0, orient: +1}   # растеж↑ = risk-on (чисто)
        labor:     {weight: 1.0, orient: +1}   # tight трудов пазар = risk-on (чисто)
        inflation: {weight: 1.0, orient: -1}   # гореща инфлация = risk-off
        # ⚠ inflation orient е РЕЖИМ-SCOPED. При reflation (излизане от криза, 2021) висока
        #   инфлация е risk-ON и orient би бил +1; в стагфлация/късен цикъл (2022, 2026) е
        #   risk-OFF (-1). Фиксиран -1, защото целият наличен прозорец е stagflation_confirmed.
        #   Режим-обусловеното превключване = Тухла 2/3 (журнал+калибрация), НЕ Ниво 1.
        liquidity: {weight: 1.0, orient: -1}   # висок lens-score → стягане = risk-off
        # ⚠ liquidity_score СМЕСВА peer-групи с противоположен риск-смисъл: money_supply↑
        #   (изобилие, +) vs policy_rates/term_structure/credit_spreads↑ (стягане/стрес, -).
        #   orient=-1 приема, че rate/spread стягането доминира риск-прочита. Чиста ориентация
        #   изисква peer-group breadth (още не е в us_macro_state) → бъдеща итерация.
    markets:
      trailing_weeks: 13    # baseline прозорец за ratio z-score (богата ETF история, 2021→)
      squash: tanh          # tanh(weighted_mean_z) → (-1,+1), за съизмеримост с икон. ос
      pairs:
        - {name: cyclical_defensive, num: XLY, den: XLP, weight: 1.0, orient: +1}  # дискреционни/стейпъл
        - {name: credit_quality,     num: HYG, den: LQD, weight: 1.0, orient: +1}  # junk/investment-grade
        - {name: breadth_size,       num: IWM, den: SPY, weight: 1.0, orient: +1}  # small/large breadth
        - {name: energy_leadership,  num: XLE, den: SPY, weight: 1.0, orient: -1}  # XLE↑ = инфл./защитен flow = risk-off
    gap:
      formula: "markets_axis - economy_axis"   # + = пазарите по-risk-on, отколкото икономиката оправдава

  EU:
    economy:
      midpoint: 50          # breadth 0-100, неутрален 50 (хармонизирана dashboard конвенция)
      scale: 50
      lenses:
        growth:    {weight: 1.0, orient: +1}   # растеж↑ = risk-on
        labor:     {weight: 1.0, orient: +1}   # tight трудов пазар = risk-on
        inflation: {weight: 1.0, orient: -1}   # режим-scoped (като US; EA дисинфлира сега, 2026-06-03)
        credit:    {weight: 1.0, orient: -1}   # EU 4-ти lens (вместо US liquidity)
        # ⚠ credit lens СМЕСВА peer-групи: CISS+sovereign spreads (стрес, -) vs M3+банков lending
        #   (експанзия, +). orient=-1 приема, че stress-страната доминира риск-прочита (EU dashboard
        #   frame-ва credit през 'credit_stress' override). Чист peer-group знак = бъдеща итерация
        #   (същият дълг като US liquidity). Решение Цветослав, 2026-06-03.
    markets:
      trailing_weeks: 13
      squash: tanh
      pairs:
        # ⚠ EU markets-кракът е ПО-ТЕСЕН от US: няма EU sector/breadth/credit ETF-и →
        #   географска цикличност (eurozone/Германия vs broad Europe) + глобален кредит.
        #   Налични 2021→ (yfinance backfill, PR #3). Решение Цветослав, 2026-06-03.
        - {name: eurozone_cyclical, num: EZU, den: VGK, weight: 1.0, orient: +1}  # eurozone (financials/периферия) vs broad Europe (UK/CH defensive)
        - {name: germany_cyclical,  num: EWG, den: VGK, weight: 1.0, orient: +1}  # Германия (auto/индустрия/export цикъл) vs broad Europe
        - {name: credit_quality,    num: HYG, den: LQD, weight: 1.0, orient: +1}  # глобален HY/IG кредит risk factor (не EU-specific — няма EU HY/IG ETF)
    gap:
      formula: "markets_axis - economy_axis"

  CN:
    economy:
      midpoint: 50          # China module composite е 0–100 healthiness (MACRO_REGIMES праг ≥65 здрав)
      scale: 50
      # ⚠ CN е РАЗЛИЧЕН от US/EU: China модулите са PRE-ORIENTED — всеки composite вече
      #   кодира "higher = по-здрава икономика = risk-on" (verified, 2026-06-03, и петте модула).
      #   Затова ВСИЧКИ orient = +1 (не режим-scoped гадаене). Lens weights = China MODULE_WEIGHTS
      #   (config.py: growth-dominant GDP-target политика, credit impulse leading indicator,
      #   property системен риск). Резултат: Σ wᵢ·(scoreᵢ−50)/50 ≡ China native composite_score
      #   на [-1,+1] оста — китайската методология през съществуващата машина, нула нов икон-код.
      #   Решение Цветослав, 2026-06-03 (recompute-с-MODULE_WEIGHTS ≡ native).
      lenses:
        growth:    {weight: 0.30, orient: +1}   # растеж↑ = score↑ = risk-on (invert=False)
        credit:    {weight: 0.25, orient: +1}   # easing↑/debt-overhang↓ = healthier credit↑ = risk-on
        property:  {weight: 0.20, orient: +1}   # цени/FDI/CA↑ = healthier property↑ = risk-on (THE системен риск)
        inflation: {weight: 0.15, orient: +1}   # ⚠ FLIPPED vs US/EU: U-shape healthiness (дефлация→нисък, optimal 1-3%→висок) → +1
        labor:     {weight: 0.10, orient: +1}   # заетост↑ = score↑ = risk-on
    markets:
      trailing_weeks: 13
      squash: tanh
      pairs:
        # ⚠ CN markets pairs (всички 2021-06→ в etf_prices, PR #3). Всеки изолира различно
        #   измерение на China risk appetite. HYG/LQD = глобален кредит anchor (и в US И в EU
        #   markets-крак → cross-region съизмеримост). Решение Цветослав, 2026-06-03.
        - {name: cn_growth_appetite, num: KWEB, den: FXI, weight: 1.0, orient: +1}  # internet/tech growth vs large-cap SOE/value
        - {name: cn_onshore_sentiment, num: ASHR, den: MCHI, weight: 1.0, orient: +1}  # onshore A-shares (policy/'national team') vs offshore broad
        - {name: cn_relative_em,     num: FXI, den: EEM, weight: 1.0, orient: +1}  # China vs broad EM (China-specific, не EM beta)
        - {name: credit_quality,     num: HYG, den: LQD, weight: 1.0, orient: +1}  # глобален HY/IG кредит risk factor (не CN-specific — няма CN HY/IG ETF)
    gap:
      formula: "markets_axis - economy_axis"

  # Германия/Япония/Корея = чисти config-врати после (EWJ/EWY ETF история вече налична).
