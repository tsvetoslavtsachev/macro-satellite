name: Weekly Briefing

on:
  schedule:
    # 06:00 UTC петък = 09:00 София петък (преди записа на видеото)
    # След петъчния daily-collect (04:00 UTC) и след COT release (петък сутрин в US time).
    - cron: '0 6 * * 5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      GITHUB_TOKEN: ${{ secrets.DASHBOARDS_READ_PAT || secrets.GITHUB_TOKEN }}
    steps:
      # LFS през Actions cache (02.09.2026): checkout с lfs:true дърпаше ВСИЧКИТЕ
      # ~490 MB LFS обекти при всеки пуск → 10 GB/месец bandwidth лимитът се изяде.
      # Сега: checkout без LFS → кешът връща вчерашните обекти → git lfs pull сваля
      # само новите. Cache-ът не се таксува; LFS bandwidth пада до делтата на деня.
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: LFS cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-

      - name: Pull LFS objects (delta only)
        run: |
          git lfs install --local
          git lfs pull

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Generate structured briefing
        run: python -m macro_satellite briefing

      - name: Generate narrative briefing (input for weekly-story-teller skill)
        run: python -m macro_satellite narrative

      - name: Generate comprehensive data export (за downstream analysis)
        run: python -m macro_satellite export-week

      - name: Commit briefings
        run: |
          git config user.name 'macro-satellite-bot'
          git config user.email 'noreply@github.com'
          git add briefings/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new briefing to commit."
          else
            git commit -m "Weekly briefing + narrative $(date -u +%Y-W%V)"
            git push
          fi
