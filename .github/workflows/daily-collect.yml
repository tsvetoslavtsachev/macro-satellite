name: Daily Collect

on:
  schedule:
    # 01:00 UTC = 04:00 София. След всички dashboard commits (~22-23 UTC).
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      # DASHBOARDS_READ_PAT (private vrm-state + higher API rate limit). Optional.
      GITHUB_TOKEN: ${{ secrets.DASHBOARDS_READ_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Collect (live snapshot)
        run: python -m macro_satellite collect

      - name: Compute delta vs previous snapshot
        run: python -m macro_satellite delta --auto-prev || echo "delta skipped (need ≥2 snapshot dates)"

      - name: Verify storage state
        run: python -m macro_satellite verify

      - name: Commit storage updates
        run: |
          git config user.name 'macro-satellite-bot'
          git config user.email 'noreply@github.com'
          git add storage/ deltas/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily collect $(date -u +%Y-%m-%d)"
            git push
          fi
