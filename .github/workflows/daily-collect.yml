name: Daily Collect

on:
  schedule:
    # 04:00 UTC = 07:00 София. Буфер 5+ часа след наблюдаваните 22-23 UTC update-и
    # на ETF/STOXX600 + покрива occasional 05:xx/08:xx late re-runs на SP500/COT.
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      # DASHBOARDS_READ_PAT (private vrm-state + higher API rate limit). Optional.
      GITHUB_TOKEN: ${{ secrets.DASHBOARDS_READ_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Collect (live snapshot)
        run: python -m macro_satellite collect

      - name: Refresh ETF prices (yfinance daily window)
        # etf_prices вече е yfinance-only (S17 Build A). 1mo прозорец + skip-existing →
        # пише само новите барове; самолекува при пропуснат ден/уикенд. Bootstrap-ът
        # (5y) се пуска ръчно при нужда: backfill-yf без --period.
        run: python -m macro_satellite backfill-yf --period 1mo

      - name: Compute delta vs previous snapshot
        run: python -m macro_satellite delta --auto-prev || echo "delta skipped (need ≥2 snapshot dates)"

      - name: Verify storage state
        run: python -m macro_satellite verify

      - name: Regenerate dashboard (HTML)
        run: python -m macro_satellite dashboard

      - name: Commit storage + dashboard updates
        run: |
          git config user.name 'macro-satellite-bot'
          git config user.email 'noreply@github.com'
          git add storage/ deltas/ docs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily collect $(date -u +%Y-%m-%d)"
            git push
          fi
